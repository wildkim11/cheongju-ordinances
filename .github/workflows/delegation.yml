name: Update delegations
on:
  schedule:
    - cron: '41 20 * * 0'   # 매주 월요일 한국시간 05:41
  workflow_dispatch:
    inputs:
      limit:
        description: '맛보기: 이 건수만 받음(비우면 전체)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: delegation-sync
  cancel-in-progress: false
jobs:
  delegation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect delegations
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
          BUDGET_MIN: '90'
        run: python -u scripts/delegation.py --mode api ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indexes/delegations.json
          if git diff --cached --quiet; then echo "변경 없음"; else git commit -m "data: refresh delegations $(date -u +%F)" && git push; fi
